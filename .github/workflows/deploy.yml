# 대시보드 화면 + 시장 지수(market.json)를 GitHub Pages에 배포합니다.
# - main에 올릴 때마다 배포
# - 장중에는 10분마다 지수를 새로 받아 다시 배포 (GitHub 사정에 따라 몇 분 늦을 수 있음)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 0-7 * * 1-5"   # 코스피 장중 (한국시간 평일 09~16시)
    - cron: "*/10 13-21 * * 1-5" # 나스닥 장중 (한국시간 평일 밤 22시~다음날 06시)

permissions:
  contents: read
  actions: read # 배포 단계가 업로드한 사이트 묶음(artifact)을 읽을 때 필요
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) 사이트 파일과 최신 지수를 묶어서 업로드
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: pages
        uses: actions/configure-pages@v6

      - name: 사이트 파일 모으기
        run: |
          mkdir _site
          cp index.html style.css app.js sw.js manifest.webmanifest icon.svg _site/

      - name: 시장 지수 받기
        continue-on-error: true
        env:
          PREV_URL: ${{ steps.pages.outputs.base_url }}/market.json
        run: node scripts/fetch-market.mjs _site/market.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # 2) 업로드한 묶음을 GitHub Pages에 배포 (업로드가 끝난 뒤 별도 작업에서 해야 묶음을 찾음)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
